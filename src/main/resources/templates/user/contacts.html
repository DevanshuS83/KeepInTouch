<!DOCTYPE html>
<html lang="en" th:replace="~{base::parent(~{::#content}, ~{::title}, ~{})}">
<head>
    <meta charset="UTF-8">
    <title>Contacts</title>
</head>
<body>
<section id="content">
    <!-- sidebar -->
    <div th:if="${user}">
        <div th:replace="~{user/sidebar::sidebar}"></div>
    </div>

    <div class="sm:pl-64">
        <h1 class="text-4xl text-center font-semibold">Your Contacts</h1>
        <p class="text-gray-500 text-center">
            Your Social Circle, Organized Effortlessly!
        </p>
        <div class="contactsContainer p-5">
            <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
                <form th:object="${contactSearchForm}" th:action="@{'/user/contacts/search'}">
                    <div class="flex p-5 items-center justify-start space-x-3 flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 pb-4 bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
                        <div class="w-40">
                            <select th:field="*{field}" id="countries_disabled" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                <option selected value="">Select Field</option>
                                <option value="name">Name</option>
                                <option value="phone">Phone</option>
                                <option value="email">Email</option>
                            </select>
                        </div>
                        <div>
                            <label for="table-search-users" class="sr-only">Search</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
                                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                                    </svg>
                                </div>
                                <input th:field="*{value}" type="text" id="table-search-users" class="block p-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Search for users">
                            </div>
                        </div>
                        <button type="submit" id="search" class="text-white bg-gray-800 hover:bg-gray-900 focus:ring-4 focus:outline-none focus:ring-gray-400 font-medium rounded-lg text-sm px-4 py-2 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Search</button>
                    </div>
                </form>
                <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th scope="col" class="px-6 py-3">Name</th>
                        <th scope="col" class="px-6 py-3">Phone</th>
                        <th scope="col" class="px-6 py-3">Links</th>
                        <th scope="col" class="px-6 py-3">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:object="${contact}" th:each="contact: ${contactPage.getContent()}" class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <th scope="row" class="flex items-center px-6 py-4 text-gray-900 whitespace-nowrap dark:text-white">
                            <img class="w-10 h-10 rounded-full" th:src="@{*{picture}}" onerror="this.src='/images/defaultProfilePic.png'" alt="Jese image">
                            <div class="ps-3">
                                <div class="text-base font-semibold" th:text="*{name}"></div>
                                <div class="font-normal text-gray-500" th:text="*{email}"></div>
                            </div>
                        </th>
                        <td class="px-6 py-4">
                            <i class="fa-solid fa-phone w-4 h-4 text-gray-500 dark:text-gray-400"></i>
                            <span th:text="*{phoneNumber}"></span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-1">
                                <a th:href="*{linkedInLink}" target="_blank"><i class="fa-brands fa-linkedin w-6 h-6 text-gray-500 dark:text-gray-400"></i></a>
                                <a th:href="*{websiteLink}" target="_blank"><i class="fa-solid fa-globe w-6 h-6 text-gray-500 dark:text-gray-400"></i></a>

                                <div th:if="*{favorite}" class="h-2.5 w-2.5  mb-5">
                                    <i class="fa-solid fa-star w-6 h-6 text-yellow-400"></i>
                                </div>
                                <div th:unless="*{favorite}" class="h-2.5 w-2.5  mb-5">
                                    <i class="fa-regular fa-star w-6 h-6 text-yellow-400"></i>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center space-x-1">
                                <a href=""><i class="fa-solid w-6 h-6  fa-trash"></i></a>
                                <a href=""><i class="fa-solid w-6 h-6  fa-pen"></i></a>
                                <a href=""><i class="fa-solid w-6 h-6  fa-eye"></i></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- pagination component -->
                <div class="paginationContainer bg-white dark:bg-gray-800 p-5 flex justify-center">
                    <nav aria-label="Page navigation example">
                        <ul class="flex items-center -space-x-px h-10 text-base">
                            <li th:unless="${contactPage.first}">
                                <a th:href="@{'/user/contacts?size='+${pageSize}+'&page='+${(contactPage.number)-1}}" class="flex items-center justify-center px-4 h-10 ms-0 leading-tight text-gray-500 bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                                    <span class="sr-only">Previous</span>
                                    <svg class="w-3 h-3 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
                                    </svg>
                                </a>
                            </li>
                            <li th:each="index: ${#numbers.sequence(0, (contactPage.totalPages)-1)}">
                                <a th:href="@{'/user/contacts?size='+${pageSize}+'&page='+${index}}" th:classappend="${(index == contactPage.number) ? 'bg-blue-50 dark:bg-gray-600' : 'bg-white dark:bg-gray-800'}" class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 border border-gray-300 hover:bg-gray-100 hover:text-gray-700  dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"><span th:text="${index+1}"></span></a>
                            </li>
                            <li th:unless="${contactPage.last}">
                                <a th:href="@{'/user/contacts?size='+${pageSize}+'&page='+${(contactPage.number)+1}}" class="flex items-center justify-center px-4 h-10 leading-tight text-gray-500 bg-white border border-gray-300 rounded-e-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                                    <span class="sr-only">Next</span>
                                    <svg class="w-3 h-3 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                                    </svg>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
